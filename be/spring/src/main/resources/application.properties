spring.application.name=food-order-api
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/food_order
spring.datasource.username=food_order
spring.datasource.password=food_order_dev_pw
spring.datasource.hikari.connection-timeout=2000

# Tính năng "thanh toán bằng ví điện tử": API key (bí mật). Không có giá trị mặc định -> thiếu là dừng khởi động.
payment.wallet.api-key=${PAYMENT_WALLET_API_KEY}

# Mở thêm endpoint info qua HTTP để đọc version và commit của bản đang chạy.
management.endpoints.web.exposure.include=health,info
