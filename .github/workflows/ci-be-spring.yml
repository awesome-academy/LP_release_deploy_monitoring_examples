name: CI be/spring

on:
  push:
    branches: [main]
    paths:
      - 'be/spring/**'
      - '.github/workflows/ci-be-spring.yml'
  pull_request:
    branches: [main]
    paths:
      - 'be/spring/**'
      - '.github/workflows/ci-be-spring.yml'

defaults:
  run:
    working-directory: be/spring

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - run: ./mvnw -B test
        env:
          PAYMENT_WALLET_API_KEY: ${{ secrets.PAYMENT_WALLET_API_KEY }}
