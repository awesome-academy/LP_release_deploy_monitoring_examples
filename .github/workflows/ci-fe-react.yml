name: CI fe/react

on:
  push:
    branches: [main]
    paths:
      - 'fe/react/**'
      - '.github/workflows/ci-fe-react.yml'
  pull_request:
    branches: [main]
    paths:
      - 'fe/react/**'
      - '.github/workflows/ci-fe-react.yml'

defaults:
  run:
    working-directory: fe/react

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: npm run lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: npx vitest run
        env:
          VITE_PAYMENT_WALLET_CLIENT_ID: ${{ vars.PAYMENT_WALLET_CLIENT_ID }}

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_PAYMENT_WALLET_CLIENT_ID: ${{ vars.PAYMENT_WALLET_CLIENT_ID }}
