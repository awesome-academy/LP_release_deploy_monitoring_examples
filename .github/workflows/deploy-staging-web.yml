name: Deploy staging (web)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version của image web-staging cần triển khai, ví dụ 1.5.0"
        required: true
        type: string

concurrency:
  group: deploy-staging-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, staging]
    environment: staging
    steps:
      - name: Kiểm tra dạng version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version phải có dạng MAJOR.MINOR.PATCH: $VERSION"
            exit 1
          fi
      - name: Triển khai image lên staging
        env:
          VERSION: ${{ inputs.version }}
        run: /srv/food-order/deploy-staging.sh web "$VERSION"
